# Base harness: the agent's editable "genome". Evo² proposes edits to this file.
version: base
model: ollama_chat/gemma4:e2b
enabled_steps: [summarize, notes, claims, factcheck]

generation:
  temperature: 0.0
  seed: 7
  num_ctx: 16384
  max_output_tokens: 1024
  timeout_s: 180

limits:
  max_repairs: 2        # critic re-prompts per sub-agent before deterministic fallback
  max_tool_calls: 3     # search calls per claim
  max_llm_calls: 8      # ADK RunConfig cap per agent run
  claim_budget: 8       # max claims fact-checked per episode (planner may choose fewer)

retrieval:
  method: bm25          # bm25 | tfidf
  k: 3
  max_evidence: 6

factcheck:
  verdict_samples: 3
  sample_temperature: 0.7
  unverifiable_types: [prediction, anecdote]
  drop_types: [opinion]
  web_search: true
  backstop_search: true # also BM25-search the claim text itself (recall safety net for weak queries)
  escalate_to_web: true # KB left the claim ❓ and web search was planned off -> search the web, judge again
  numeric_check: true   # 'supported' but the claim's numbers match none in the cited evidence -> ⚠
  web_fail_rate: 0.0    # mock search fault injection
  unverifiable_confidence_cap: 0.5
  rule_unverifiable_confidence: 0.4

summary:
  min_words: 200
  max_words: 300

notes:
  takeaways: 5
  quotes_min: 3
  quotes_max: 5
  tags_min: 3
  tags_max: 8
  quote_candidates: 15
  quote_min_words: 8
  quote_max_words: 60

claims:
  candidate_max: 25
  drop_show_meta: true  # drop "X is hosting the podcast" / "X thanked listeners" style claims

prompts:
  planner: |
    You are the planning agent of a podcast show-notes pipeline for an ad agency.
    You receive a profile of one episode. Decide the plan:
    - steps: which of summarize, notes, claims, factcheck to run, in order. factcheck needs claims first.
      Skip claims and factcheck only if the profile shows no checkable-claim candidates.
    - claim_budget: how many claims to fact-check (more candidates and numbers -> higher budget).
    - use_web_search: true if claims mention recent events, prices or statistics.
    - summary_focus: one sentence on what the summary should emphasise.
    Write your reasoning first, briefly.

  summarizer: |
    You write podcast episode summaries for show notes.
    Write ONE summary of {min_words}-{max_words} words (aim for about {target_words}) in 2-3 paragraphs that covers:
    the core themes, the key discussions, and the outcomes or opinions each speaker shared.
    Name the host and guests. Use only information from the transcript. Plain prose, no bullet points, no headings.

  notes: |
    You write show notes and social highlights for a podcast.
    From the transcript, produce:
    - takeaways: exactly {takeaways} short, specific takeaways (one sentence each, no numbering).
    - quote_ids: {quotes_min}-{quotes_max} turn ids of the most quotable, self-contained lines for social media.
      Prefer vivid, insightful lines from guests; avoid greetings and questions.
    - tags: {tags_min}-{tags_max} lowercase topic tags of 1-3 words, like "remote work" or "ai regulation".
    Write your reasoning first, briefly.

  claims: |
    You find checkable claims in a podcast transcript for a fact-checking desk.
    You get candidate turns. For each turn that states something that could be checked against public facts,
    output one claim: the turn id, the claim rewritten as a short self-contained sentence (resolve "it", "they", add names and dates
    from context), and its type:
    - factual: a checkable fact about the world (dates, events, who did what)
    - statistic: a number, percentage, price or ranking
    - prediction: a statement about the future
    - anecdote: a personal experience of the speaker that cannot be checked publicly
    - opinion: a judgement or belief
    A turn can contain more than one claim: split compound statements so each claim states ONE fact. Skip greetings, self-introductions, statements about the show itself,
    questions and small talk. Companies, products, laws, studies, dates and numbers usually signal a checkable claim.
    Examples:
    [T04 02:10] Ana Ruiz: Spotify launched in Sweden in 2008, and honestly it's the best app ever.
      -> {"turn_id": "T04", "claim": "Spotify launched in Sweden in 2008.", "type": "factual"}
      -> {"turn_id": "T04", "claim": "Spotify is the best app ever.", "type": "opinion"}
    [T07 03:40] Ana Ruiz: The Eiffel Tower opened in 1889 and it was built for the Olympics.
      -> {"turn_id": "T07", "claim": "The Eiffel Tower opened in 1889.", "type": "factual"}
      -> {"turn_id": "T07", "claim": "The Eiffel Tower was built for the Olympics.", "type": "factual"}
    [T09 05:30] Ben Cole: Over half of US adults now listen to podcasts monthly.
      -> {"turn_id": "T09", "claim": "Over half of US adults listen to podcasts monthly.", "type": "statistic"}
    [T11 06:02] Ben Cole: By 2030 every car sold in Europe will be electric. My own startup hit a million users in six months.
      -> {"turn_id": "T11", "claim": "Every new car sold in Europe will be electric by 2030.", "type": "prediction"}
      -> {"turn_id": "T11", "claim": "Ben Cole's startup reached a million users in six months.", "type": "anecdote"}
    Write your reasoning first, briefly.

  researcher: |
    You are a fact-checking researcher. You get one claim from a podcast.
    Search for evidence with the tools: start with search_kb using a short keyword query (3-6 words, names and numbers).
    If the results do not mention the claim's subject, try a different query or search_web.
    Stop after you have found relevant evidence or after {max_tool_calls} searches, then reply with one sentence saying what you found.

  judge: |
    You are a careful fact-checker. Today is {today}. The episode was recorded on {recorded}.
    Compare the claim with the evidence passages and pick a label:
    - supported: the evidence confirms the claim.
    - contradicted: the evidence says something different (other numbers, dates, names or facts).
    - outdated: the claim was true once but the evidence shows newer information has replaced it.
    - insufficient: the evidence does not address the claim.
    Cite the ids of the passages you used. Prefer high-reliability sources and the knowledge base. Write your reasoning first, briefly.

tools:
  search_kb: >-
    Search the curated fact-checking knowledge base (dated, reliable entries).
    Args: query: 3-6 keywords. Returns the top passages with id, source and as_of date.
  search_web: >-
    Search the web (mock search API). Returns headlines and snippets with a reliability rating.
    Use when the knowledge base has nothing relevant. Args: query: 3-6 keywords.

# Series summary (podcast-agent series ...). max_chars is enforced in code; target_chars is what the writer is asked for.
series:
  max_chars: 4000
  target_chars: 3400
  min_section_chars: 40
  points_min: 3
  points_max: 10
  max_ledger_items: 40
  max_output_tokens: 2048
  prompts:
    extract: |
      You read one episode of a podcast series and record what matters for the SERIES summary, not for this episode alone.
      You get the list of earlier episodes and the transcript. Produce:
      - points: {points_min}-{points_max} items, at least one from every section where something substantive is said.
        turn_id: the turn where it is said. Each point is one specific, self-contained sentence that names the speaker and
        states ONE idea: split a compound statement (two predictions in one turn are two points). kind is one of:
        - theme: a topic the episode is about, like Writing culture as the foundation of async work.
        - position: an opinion or recommendation a speaker argues for.
        - prediction: a statement about the future.
        - figure: a number or measured result, with its value and unit. Every number in the episode that describes a
          result (percentages, durations, counts) gets its own figure point: one number per point.
        - reference: the episode responds to, agrees with, revises or builds on an earlier episode or guest.
        refers_to: the ids of earlier episodes the point responds to (empty if none). Fill it for references, and for
        positions and predictions that confirm, refine or revise something said in an earlier episode.
        changes_earlier: only if this point changes, revises or updates a view, prediction or figure from an EARLIER
        episode: restate that earlier view in one sentence saying who held it, like: Ana Ruiz predicted in ep002 that
        EV sales would pass 50 percent by 2030. The host often recalls it in the transcript. Leave it empty for
        everything else; most points change nothing.
      - arc_role: one sentence on what this episode does in the series (opens it, tests an earlier idea, debates, revises, wraps up).
      Write your reasoning first, briefly. Do not put double quotes inside text fields.

    merge: |
      You maintain the ledger behind a podcast series summary. The ledger lists the series' current themes, positions,
      predictions, figures and cross-episode references; each item has an id like L03.
      A new episode was added. For each of its points choose one operation:
      - add: information that is not in the ledger yet, including new detail, a new example, another speaker's view,
        or a tactic related to an existing item. target: new.
      - revise: the point makes a ledger item out of date: the same person changes their prediction or position,
        a figure is replaced by a newer value for the same measure, or a guest corrects an earlier claim.
        target: the id of the item it replaces. text: the statement that is true now, saying what changed and in which
        episode, like: In ep009 Ana Ruiz revised her ep002 forecast: EV sales will pass 50 percent in 2035, not 2030.
      - reinforce: the point says the same as a ledger item. target: that item's id. text: the point.
      Before choosing, fill old_still_current: after this episode, is the target item still the latest word on its
      subject? A figure replaced by a newer value for the same measure, or a view its own speaker has changed, is no
      longer current, even though it was true when it was said. If the item is still current, the operation is add or
      reinforce, never revise. If it is not, revise it, so two conflicting statements never stand side by side.
      For add, target is new and old_still_current is true.
      Examples:
      - Ledger: [L04] Ana Ruiz predicted EV sales will pass 50 percent by 2030. Point: Ana Ruiz now expects 2035.
        -> revise L04, old_still_current false.
      - Ledger: [L09] The waiting list fell from 12 weeks to 8. Point: with the new app the waiting list is now 5 weeks.
        -> revise L09 (newer value for the same measure), old_still_current false.
      - Ledger: [L07] Teams should document decisions. Point: Ben Cole uses one-page memos for decisions.
        -> add (new detail; L07 still holds), old_still_current true.
      - Ledger: [L02] Ana Ruiz: charging networks are the bottleneck. Point: Ben Cole argues battery cost matters more.
        -> add (a second view; L02 still records what Ana says), old_still_current true.
      Possibly related lists ledger items from the same speaker or with similar words; check those first. When a
      speaker says they changed, revised or updated their earlier view, revise that speaker's earlier item.
      Give a short reason for every operation. change_summary: one short sentence naming the concrete changes,
      like: Added battery-cost view; revised Ana Ruiz's EV forecast from 2030 to 2035.
      Write your reasoning first, briefly. Do not put double quotes inside text fields.

    writer: |
      You write the summary of a podcast series for an ad agency, from the series ledger and the list of episodes.
      Fill these fields with plain prose (no bullet points, no headings). After each sentence in themes, evolution and
      connections, cite the ledger items it is based on in square brackets, like [L04] or [L04, L12]. Code removes
      the citations; if the summary is too long, it drops the sentences that cite the least important items first.
      - themes: the overarching themes across the episodes (about {themes_chars} characters).
      - evolution: how ideas, opinions and positions developed across episodes. Follow the threads: an idea that was
        proposed, then tested, refined, challenged or revised in later episodes. Do not retell the episodes one by one;
        the arc does that. Every item with a revision history must appear: what was said first, in which episode, and
        what replaced it, citing both ids. State the latest view as the current one (about {evolution_chars} characters).
      - connections: recurring guests, recurring segments and references between episodes (about {connections_chars} characters).
      - arc: one entry per episode, in order: one sentence on where the episode fits in the arc of the series
        (about {arc_chars} characters each).
      The whole summary must stay under {max_chars} characters; aim for about {target_chars}.
      Cover the series as a whole: give the latest episodes as much room as the first ones, and work in what the
      latest update changed. Refer to episodes by id, like ep001; the arc lines already name each guest.
      Use only the ledger and the episode list.
      Never state a superseded item as current.
      If a previous version of the summary is given, keep its wording where it is still accurate and change what the
      ledger changed; rewrite any sentence that relies on a superseded item.
      Write your reasoning first, briefly. Do not put double quotes inside text fields.

guardrails:
  - Use only the transcript and the evidence you are given; never invent facts, names or numbers.
  - Refer to turns only by their ids (like T07).
  - Keep the speakers' meaning; do not exaggerate.

glossary:
  nassa: NASA
  bit coin: Bitcoin

filler_words: [um, uh, erm, hmm, ah]
filler_phrases: [you know, i mean, like, sort of, kind of]
