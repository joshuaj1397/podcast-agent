[project]
name = "podcast-agent"
version = "0.1.0"
description = "Agentic podcast summarizer, show-notes extractor and fact-checker (Google ADK + Gemma 4 E2B)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk",
    "litellm",
    "pydantic>=2.7",
    "pyyaml>=6",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.5",
    "rich>=13",
    "typer>=0.12",
    "mcp>=2.3.0",
]

[project.scripts]
podcast-agent = "podcast_agent.cli:app"

[project.optional-dependencies]
aws = [
    "boto3>=1.43.122",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podcast_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
